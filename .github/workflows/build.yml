name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Imza anahtarini hazirla
        run: base64 -d crossup.keystore.b64 > app/crossup.jks

      - name: APK Derle
        run: gradle assembleRelease -PbuildNumber=${{ github.run_number }} -PghRepo=${{ github.repository }}

      - name: APK adini duzenle
        run: cp "$(ls app/build/outputs/apk/release/*.apk | head -n 1)" CrossUp.apk

      - name: GitHub Release olustur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" CrossUp.apk \
            --target "${{ github.sha }}" \
            --title "CrossUp ${{ github.run_number }}" \
            --notes "Otomatik derleme #${{ github.run_number }}" \
            --latest
